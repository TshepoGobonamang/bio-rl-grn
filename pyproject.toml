[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "grn-reliability-benchmark"
version = "0.2.0"
description = "Leakage-aware graph-conditioned GRN inference benchmark and independent evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.11,<2", "scikit-learn>=1.3,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
[project.scripts]
grnb = "grnbench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
