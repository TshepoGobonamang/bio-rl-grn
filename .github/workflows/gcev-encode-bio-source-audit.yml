name: GCEV ENCODE K562 independent perturbation source audit
on:
  push:
    branches: [research/gcev-encode-perturb-validation]
    paths:
      - 'scripts/audit_encode_crispri_panel.py'
      - 'scripts/prepare_encode_replicate_responses.py'
      - 'tests/test_encode_crispri_panel.py'
      - 'tests/test_encode_replicate_responses.py'
      - 'configs/encode_crispri_k562_panel_2026_11_25.json'
      - '.github/workflows/gcev-encode-bio-source-audit.yml'
  pull_request:
    paths:
      - 'scripts/audit_encode_crispri_panel.py'
      - '.github/workflows/gcev-encode-bio-source-audit.yml'
      - 'configs/encode_crispri_k562_panel_2026_11_25.json'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local test requirements
        run: python -m pip install '.[dev]'
      - name: Tests include fail-closed biological design and replication checks
        run: python -m pytest -q tests/test_encode_crispri_panel.py tests/test_encode_replicate_responses.py
      - name: Record frozen panel and source-audit code revision
        run: |
          git rev-parse HEAD
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('configs/encode_crispri_k562_panel_2026_11_25.json')
          print('frozen_panel_sha256:', hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Request original ENCODE metadata and record source hashes
        run: |
          python scripts/audit_encode_crispri_panel.py \
            --manifest configs/encode_crispri_k562_panel_2026_11_25.json \
            --output results/encode_k562/source_metadata_audit.json
      - name: Show actual source-audit decision, including missing per-replicate files
        if: always()
        run: |
          if test -s results/encode_k562/source_metadata_audit.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('results/encode_k562/source_metadata_audit.json').read_text())
          for x in a.get('experiments',[]):
              print(x['accession'], 'design=',x.get('design_metadata_pass'), 'replicate_q=',x.get('per_replicate_quantification_available'), 'qualified_files=',len(x.get('per_replicate_grch38_quantifications',[])), 'file_candidates=',len(x.get('quantification_candidates',[])), 'QC=',x.get('audit_counts',{}))
              print(' FLAGS:', {k:x.get(k) for k in ('assay_match','cell_line_match','released','target_match','linked_expected_control','replication_type','biological_replicate_numbers','biosample_identifiers','unresolved_replicate_references','biosample_replicates_verified_from_metadata','unresolved_file_references')})
              for q in x.get('quantification_candidates',[]): print(' FILE:', {k:q.get(k) for k in ('accession','assembly','genome_annotation','biological_replicates','one_biological_replicate','href')})
          print('DECISION:',a.get('decision'),'ERRORS:',a.get('errors'))
          PY
          else
            echo 'Source audit did not produce a JSON report' >&2
          fi
      - name: Upload audit report even if source qualification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcev-encode-k562-original-source-metadata-audit
          path: results/encode_k562/*.json
          if-no-files-found: error
