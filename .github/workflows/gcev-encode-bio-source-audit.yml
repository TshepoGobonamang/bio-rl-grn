name: GCEV ENCODE K562 independent perturbation source audit
on:
  push:
    branches: [research/gcev-encode-perturb-validation]
    paths:
      - 'scripts/audit_encode_crispri_panel.py'
      - 'scripts/prepare_encode_replicate_responses.py'
      - 'tests/test_encode_crispri_panel.py'
      - 'tests/test_encode_replicate_responses.py'
      - 'configs/encode_crispri_k562_panel_2026_11_25.json'
      - '.github/workflows/gcev-encode-bio-source-audit.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local test requirements
        run: python -m pip install '.[dev]'
      - name: Tests include fail-closed biological design and replication checks
        run: python -m pytest -q tests/test_encode_crispri_panel.py tests/test_encode_replicate_responses.py
      - name: Request original ENCODE metadata and record source hashes
        run: |
          python scripts/audit_encode_crispri_panel.py \
            --manifest configs/encode_crispri_k562_panel_2026_11_25.json \
            --output results/encode_k562/source_metadata_audit.json
      - name: Upload audit report even if source qualification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcev-encode-k562-original-source-metadata-audit
          path: results/encode_k562/*.json
          if-no-files-found: error
