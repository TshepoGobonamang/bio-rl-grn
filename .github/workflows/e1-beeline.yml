name: E1 BEELINE dyn-LL-500 exploratory benchmark
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "BEELINE synthetic replicate identifier"
        required: true
        default: dyn-LL-500-1
        type: string
jobs:
  e1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Fetch official BEELINE v4 archive (not committed)
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://zenodo.org/records/19009603/files/BEELINE-data.zip?download=1' \
            --output "$RUNNER_TEMP/BEELINE-data.zip"
      - name: Verify checksum, extract requested replicate
        run: |
          python scripts/extract_beeline_v4.py \
            --archive "$RUNNER_TEMP/BEELINE-data.zip" \
            --run "${{ inputs.run_id }}" \
            --output data/raw/beeline/e1
      - name: Run exploratory inference then evaluation
        run: |
          python scripts/run_e1.py \
            --raw-dir data/raw/beeline/e1 \
            --processed-dir data/processed/e1 \
            --results-dir results/e1 \
            --seed 42 --max-edges 20 --alpha 1.0
      - name: Upload results only (no expression data)
        uses: actions/upload-artifact@v4
        with:
          name: e1-beeline-${{ inputs.run_id }}
          path: results/e1/
          if-no-files-found: error
