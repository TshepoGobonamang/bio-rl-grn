name: M2D11 real H5AD metadata audit
on:
  workflow_dispatch:
jobs:
  h5ad-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout audited inspector implementation
        uses: actions/checkout@v4
        with:
          ref: feat/m2d10-h5ad-observation
          persist-credentials: false
      - name: Show inspected commit and disk capacity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -f scripts/inspect_m2d10_h5ad.py
          test -f tests/test_m2d10_h5ad.py
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'anndata>=0.10,<0.13' pandas pytest
      - name: Verify inspection tests
        run: python -m pytest -q tests/test_m2d10_h5ad.py
      - name: Fetch actual GSE216595 processed H5AD
        shell: bash
        run: |
          set -euo pipefail
          url='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE216nnn/GSE216595/suppl/GSE216595_180124_perturb.h5ad.gz'
          curl --fail --location --retry 4 --retry-delay 5 --continue-at - --show-error "$url" \
            -o "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          test -s "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          gzip -t "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          sha256sum "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          df -h "$RUNNER_TEMP"
      - name: Audit observed cell and gene metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inspect_m2d10_h5ad.py \
            --h5ad "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz" \
            --output results/m2d11/observed_h5ad_schema.json
      - name: Publish real-source schema observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2d11-real-h5ad-metadata
          path: results/m2d11/observed_h5ad_schema.json
          if-no-files-found: error
