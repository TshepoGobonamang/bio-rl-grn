name: BIO-V3B authentic K562-only expression source audit
on:
  push:
    branches: [research/gcev-biov3b-k562-only-source]
    paths:
      - 'configs/biov3b_pure_k562_source_2026_11_26.json'
      - 'scripts/audit_biov3b_k562_pure_h5ad.py'
      - 'tests/test_biov3b_k562_pure_h5ad.py'
      - '.github/workflows/gcev-biov3b-pure-k562.yml'
  pull_request:
    paths:
      - 'scripts/audit_biov3b_k562_pure_h5ad.py'
      - 'tests/test_biov3b_k562_pure_h5ad.py'
      - '.github/workflows/gcev-biov3b-pure-k562.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  k562-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact source-audit dependencies
        run: python -m pip install "anndata>=0.10,<0.13" scipy pandas numpy pytest
      - name: Fail-closed original-source inspection tests
        run: python -m pytest -q tests/test_biov3b_k562_pure_h5ad.py
      - name: Record source protocol and checkout revision
        run: |
          git rev-parse HEAD
          sha256sum configs/biov3b_pure_k562_source_2026_11_26.json
      - name: Download original K562-only GEO H5AD
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 5 --show-error \
            --connect-timeout 25 --max-time 900 \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM9224nnn/GSM9224207/suppl/GSM9224207_Fresh_K562.h5ad' \
            -o "$RUNNER_TEMP/GSM9224207_Fresh_K562.h5ad"
          test -s "$RUNNER_TEMP/GSM9224207_Fresh_K562.h5ad"
          sha256sum "$RUNNER_TEMP/GSM9224207_Fresh_K562.h5ad"
          file "$RUNNER_TEMP/GSM9224207_Fresh_K562.h5ad"
      - name: Inspect and preserve original expression matrix without assuming scale
        run: |
          python scripts/audit_biov3b_k562_pure_h5ad.py \
            --h5ad "$RUNNER_TEMP/GSM9224207_Fresh_K562.h5ad" \
            --output results/biov3b_pure_k562 \
            --export
      - name: Upload authentic K562-only matrix with untouched IDs and values
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcev-biov3b-authentic-k562-only-expression
          path: results/biov3b_pure_k562/
          if-no-files-found: error
          retention-days: 60
