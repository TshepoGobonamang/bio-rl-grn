name: BIO-V6 original two-replicate K562 DNase promoter accessibility
on:
  push:
    branches: [research/gcev-biov6-k562-dnase-accessibility-prior]
    paths:
      - 'docs/BIOV6_LOCKED_K562_DNASE_ACCESSIBILITY_2026_11_27.md'
      - 'scripts/biov6_k562_dnase_accessibility.py'
      - 'tests/test_biov6_k562_dnase_accessibility.py'
      - '.github/workflows/gcev-biov6-k562-dnase-prior.yml'
  pull_request:
    paths:
      - 'scripts/biov6_k562_dnase_accessibility.py'
      - 'tests/test_biov6_k562_dnase_accessibility.py'
      - '.github/workflows/gcev-biov6-k562-dnase-prior.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  original-k562-dnase:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible minimal source-inspection tools
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "pytest>=8,<10"
      - name: Run fail-closed DNase file/biosample and promoter-overlap tests
        run: python -m pytest -q tests/test_biov6_k562_dnase_accessibility.py
      - name: Audit frozen study before real DNase source accession lookup
        run: |
          git rev-parse HEAD
          sha256sum docs/BIOV6_LOCKED_K562_DNASE_ACCESSIBILITY_2026_11_27.md
      - name: Fetch original BIO-V5 1,008-edge motif evidence and 64 source promoters
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov5-actual-hg38-jaspar-motif-promoter-prior
          repository: ${{ github.repository }}
          run-id: 45988423247
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/biov5_prior_frozen
      - name: Obtain authentic K562 DNase-seq replicates with original ENCODE MD5 and overlap promoters
        run: |
          python -m scripts.biov6_k562_dnase_accessibility \
            --biov5 results/biov5_prior_frozen \
            --output results/biov6_dnase
      - name: Independent no-leakage and exact source-matrix audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,numpy as np,pandas as pd
          from pathlib import Path
          root=Path("results/biov6_dnase")
          m=json.loads((root/"biov6_source_audit.json").read_text())
          p=pd.read_csv(root/"k562_dnase_promoter_accessibility_64.csv")
          e=pd.read_csv(root/"k562_tf_target_accessibility_and_motif_context_1008.csv")
          assert len(p)==64 and len(e)==1008 and not e.duplicated(["tf","target"]).any()
          assert not (e.tf==e.target).any()
          assert set(e.target)==set(p.gene_symbol)
          assert all(p[k].between(0,1).all() for k in ("dnase_replicate1_coverage","dnase_replicate2_coverage","dnase_accessibility_mean","dnase_accessibility_min"))
          assert np.allclose(p.dnase_accessibility_mean,(p.dnase_replicate1_coverage+p.dnase_replicate2_coverage)/2,atol=1e-12)
          assert np.allclose(e.joint_motif_dnase_product,e.motif_prior_score*e.dnase_accessibility_mean,atol=1e-12)
          assert (e.groupby("target").dnase_accessibility_mean.nunique()==1).all()
          assert e.accessibility_source_observed.all()
          assert not e.direct_tf_binding_verified.any()
          assert not e.independent_regulatory_edge_truth.any()
          assert m["ENCODE_perturbation_expression_outcomes_accessed"] is False
          assert len(m["source_bed_file_summaries"])==2
          assert m["joint_prior_is_independent_third_source"] is False
          for name,expected in m["file_sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected
          print("INDEPENDENT_BIOV6_AUDIT_OK",len(p),"promoters",len(e),"edges",m["promoters_with_peak_both_replicates"],"two-replicate accessible promoters")
          PY
      - name: Retain original-source audited promoter-level and TF-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcev-biov6-authentic-k562-dnase-replicate-promoter-accessibility
          path: results/biov6_dnase/
          if-no-files-found: warn
          retention-days: 75
