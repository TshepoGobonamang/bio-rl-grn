name: BIO-V6 secondary source processing pipeline matched sensitivity
on:
  push:
    branches: [research/gcev-biov6-k562-dnase-accessibility-prior]
    paths:
      - 'docs/BIOV6_SECONDARY_MATCHED_PIPELINE_SENSITIVITY_2026_11_27.md'
      - 'scripts/biov6_matched_caller_sensitivity.py'
      - 'tests/test_biov6_matched_caller_sensitivity.py'
      - '.github/workflows/gcev-biov6-matched-dnase-sensitivity.yml'
  pull_request:
    paths:
      - 'docs/BIOV6_SECONDARY_MATCHED_PIPELINE_SENSITIVITY_2026_11_27.md'
      - 'scripts/biov6_matched_caller_sensitivity.py'
      - 'tests/test_biov6_matched_caller_sensitivity.py'
      - '.github/workflows/gcev-biov6-matched-dnase-sensitivity.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  matched-callers:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum source interpretation/test dependencies
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "scipy>=1.11,<2" "pytest>=8,<10"
      - name: Verify original source assay and fixed version-specific file selection
        run: python -m pytest -q tests/test_biov6_k562_dnase_accessibility.py tests/test_biov6_matched_caller_sensitivity.py
      - name: Freeze secondary analysis code and two version definitions
        run: |
          git rev-parse HEAD
          sha256sum docs/BIOV6_SECONDARY_MATCHED_PIPELINE_SENSITIVITY_2026_11_27.md
      - name: Download original verified BIO-V5 TF-to-promoter motif prior
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov5-actual-hg38-jaspar-motif-promoter-prior
          run-id: 45988423247
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/biov5_frozen
      - name: Download preregistered original heterogeneous pipeline outcome without alteration
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov6-authentic-k562-dnase-replicate-promoter-accessibility
          run-id: 45991610752
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/biov6_original
      - name: Requantify both matched ENCODE DNase peak processing versions
        run: |
          python -m scripts.biov6_matched_caller_sensitivity \
            --biov5 results/biov5_frozen \
            --original-primary results/biov6_original/k562_dnase_promoter_accessibility_64.csv \
            --output results/biov6_matched_callers
      - name: Independently verify exact two-pipeline source matching and original results unchanged
        run: |
          python - <<'PY'
          import hashlib,json,numpy as np,pandas as pd
          from pathlib import Path
          root=Path('results/biov6_matched_callers')
          meta=json.loads((root/'biov6_secondary_pipeline_sensitivity_manifest.json').read_text())
          assert set(meta['two_matched_peak_callers'])=={'v1','v2'}
          assert meta['ENCODE_CRISPRi_response_outcomes_accessed'] is False
          for kind,info in meta['two_matched_peak_callers'].items():
              assert len(info['selected_original_files'])==2
              assert len({x['biosample_id'] for x in info['selected_original_files']})==2
              assert len({x['pipeline'] for x in info['selected_original_files']})==1
              p=pd.read_csv(root/f'k562_dnase_{kind}_matched_promoter_coverage_64.csv')
              e=pd.read_csv(root/f'k562_dnase_{kind}_matched_joint_context_1008.csv')
              assert len(p)==64 and len(e)==1008 and not e.duplicated(['tf','target']).any()
              assert e.accessibility_source_observed.all()
              assert e.joint_motif_dnase_product.between(0,1).all()
              assert np.allclose(e.joint_motif_dnase_product,e.motif_prior_score*e.dnase_accessibility_mean)
          for name,expected in meta['file_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected
          print('BOTH_MATCHED_PIPELINE_SENSITIVITIES_VERIFIED')
          PY
      - name: Retain both source-matched exploratory sensitivity datasets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcev-biov6-matched-k562-dnase-two-pipeline-sensitivity
          path: results/biov6_matched_callers/
          if-no-files-found: warn
          retention-days: 75
