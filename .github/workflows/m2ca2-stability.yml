name: M2C-A2 crossfold stability and locked topology evaluation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2ca2-stability.yml'
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify stability, shuffle and reference-access safeguards
        run: python -m pytest -q
      - name: Retrieve official BEELINE v4 archive once
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://zenodo.org/records/19009603/files/BEELINE-data.zip?download=1' \
            --output "$RUNNER_TEMP/BEELINE-data.zip"
      - name: Extract six declared structures without versioning expression data
        run: |
          for run in dyn-LL-500-1 dyn-LI-500-1 dyn-BF-500-1 dyn-CY-500-1 dyn-TF-500-1 dyn-BFC-500-1; do
            python scripts/extract_beeline_v4.py \
              --archive "$RUNNER_TEMP/BEELINE-data.zip" \
              --run "$run" --output "data/raw/beeline/$run"
          done
      - name: Development — repeated split seeds and bins, gold BLIND
        run: |
          python scripts/run_m2ca2.py \
            --raw-root data/raw/beeline \
            --results-root results/m2ca2 \
            --role development
      - name: LOCKED confirmation — generate scores before opening gold
        run: |
          python scripts/run_m2ca2.py \
            --raw-root data/raw/beeline \
            --results-root results/m2ca2 \
            --role confirmation
      - name: Post-hoc confirmation — ONLY now inspect reference labels
        run: |
          python scripts/evaluate_m2ca2.py \
            --results-root results/m2ca2 \
            --raw-root data/raw/beeline
      - name: Upload all score/stability and reference-evaluation audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2ca2-stability-locked-confirmation
          path: results/m2ca2/
          if-no-files-found: warn
