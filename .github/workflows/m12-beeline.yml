name: M1.2 BEELINE pseudotime direction pilot

on:
  # Execute once on first merge, when this workflow file enters main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/m12-beeline.yml'
  workflow_dispatch:

jobs:
  pseudotime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run software tests before benchmarking
        run: python -m pytest -q
      - name: Fetch BEELINE v4 once; raw data remain outside version control
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://zenodo.org/records/19009603/files/BEELINE-data.zip?download=1' \
            --output "$RUNNER_TEMP/BEELINE-data.zip"
      - name: Compare different generating topologies
        run: |
          for run in dyn-LL-500-1 dyn-LI-500-1 dyn-BF-500-1; do
            echo "=== $run ==="
            python scripts/extract_beeline_v4.py \
              --archive "$RUNNER_TEMP/BEELINE-data.zip" \
              --run "$run" --output "data/raw/beeline/$run"
            python scripts/run_m12.py \
              --raw-dir "data/raw/beeline/$run" \
              --processed-dir "data/processed/m12/$run" \
              --results-dir "results/m12/$run" \
              --seed 42 --max-edges 20 --alpha 1.0 \
              --bins 16 --temporal-weight 0.015
          done
      - name: Upload only inference and evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m12-pseudotime-direction-pilot
          path: results/m12/
          if-no-files-found: warn
