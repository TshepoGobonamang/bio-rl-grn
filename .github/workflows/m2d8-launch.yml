name: M2D8 GEO source audit launcher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m2d8-launch.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed research branch containing D8 source inspector"
        required: true
        type: choice
        options:
          - feat/m2d8-source-observation
        default: feat/m2d8-source-observation
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out D8 research code
        uses: actions/checkout@v4
        with:
          ref: feat/m2d8-source-observation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install pandas pytest
      - name: Test source inspector
        run: python -m pytest -q tests/test_m2d8_real_tfmap.py
      - name: Fetch original GEO source
        shell: bash
        run: |
          set -euo pipefail
          url='https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM6681nnn/GSM6681047/suppl/GSM6681047_180124_TFmap.csv.gz'
          curl --fail --location --retry 4 --retry-delay 3 --show-error "$url" -o "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          test -s "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          gzip -t "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          sha256sum "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
      - name: Inspect actual rows and source schema
        run: |
          python scripts/observe_m2d8_real_tfmap.py \
            --source "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz" \
            --output results/m2d8/actual_tfmap_observation.json
      - name: Upload metadata audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2d8-actual-source-observation
          path: results/m2d8/*.json
          if-no-files-found: warn
