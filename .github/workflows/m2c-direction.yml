name: M2C-A directional cross-fitted evidence targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2c-direction.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run regression tests (includes direction and leakage tests)
        run: python -m pytest -q
      - name: Fetch official BEELINE v4 archive (not committed)
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://zenodo.org/records/19009603/files/BEELINE-data.zip?download=1' \
            --output "$RUNNER_TEMP/BEELINE-data.zip"
      - name: Generate direction-sensitive held-out targets, no gold input
        run: |
          for run in dyn-LL-500-1 dyn-LI-500-1 dyn-BF-500-1; do
            python scripts/extract_beeline_v4.py \
              --archive "$RUNNER_TEMP/BEELINE-data.zip" \
              --run "$run" --output "data/raw/beeline/$run"
            # The builder reads only expression and pseudotime, NEVER gold.
            python scripts/build_m2_direction.py \
              --raw-dir "data/raw/beeline/$run" \
              --output-dir "results/m2c/$run" \
              --dataset-id "$run" \
              --folds 3 --bins 16 --bootstrap-repeats 3 --seed 42
          done
          python scripts/audit_m2_direction.py --root results/m2c
      - name: Upload labeled surrogate targets and fit-only features
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2c-directional-crossfit-targets
          path: results/m2c/
          if-no-files-found: warn
