name: BIO-V7 real K562 matched comparison reproduction

on:
  push:
    branches: [research/gcev-biov7-k562-matched-comparison]
    paths:
      - 'scripts/biov7*.py'
      - 'scripts/verify_biov7*'
      - 'configs/biov7*'
      - 'tests/test_biov7*'
      - '.github/workflows/gcev-biov7-k562-comparison.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-frozen-k562-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned comparison environment
        run: >-
          python -m pip install
          "numpy==2.3.5" "pandas==2.2.3" "scipy==1.17.0"
          "scikit-learn==1.8.0" "pytest==9.2.0" -e .
      - name: Test frozen partition and matched action invariants
        run: >-
          python -m pytest -q
          tests/test_biov7_constrained_models.py
          tests/test_biov7_run_k562_comparison.py
      - name: Fetch original K562 expression and sealed partitions
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov3b-authentic-k562-only-expression
          run-id: 45881788164
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/original
      - name: Fetch frozen TF-aware 64-gene cohort
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov4b-real-k562-tfaware-64-gene-development-cohort
          run-id: 45889615265
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/cohort
      - name: Fetch sequence-backed motif prior
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov5-actual-hg38-jaspar-motif-promoter-prior
          run-id: 45988423247
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/biov5
      - name: Fetch original primary DNase prior
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov6-authentic-k562-dnase-replicate-promoter-accessibility
          run-id: 45991610752
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/biov6/primary
      - name: Fetch both matched processing sensitivities
        uses: actions/download-artifact@v4
        with:
          name: gcev-biov6-matched-k562-dnase-two-pipeline-sensitivity
          run-id: 45992406882
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/biov6/pipeline_sensitivity
      - name: Freeze all decisions using only the 394 fitting cells
        run: |
          python -m scripts.biov7_run_k562_comparison freeze \
            --cohort inputs/cohort \
            --original inputs/original/biov3b_pure_k562 \
            --biov5 inputs/biov5 \
            --biov6 inputs/biov6 \
            --protocol configs/biov7_k562_comparison_2026_11_27.json \
            --output results/biov7
      - name: Preserve fit-only decisions before internal-score evaluation
        uses: actions/upload-artifact@v4
        with:
          name: gcev-biov7-fit-only-frozen-decisions-before-internal-score
          path: results/biov7/
          if-no-files-found: error
          retention-days: 75
      - name: Evaluate frozen graphs on 131 internal-score cells
        run: |
          python -m scripts.biov7_run_k562_comparison evaluate \
            --cohort inputs/cohort \
            --original inputs/original/biov3b_pure_k562 \
            --biov5 inputs/biov5 \
            --biov6 inputs/biov6 \
            --protocol configs/biov7_k562_comparison_2026_11_27.json \
            --output results/biov7
      - name: Independently recompute metrics and compare committed reference
        run: |
          python -m scripts.verify_biov7_comparison \
            --results results/biov7 \
            --reference reports/biov7_k562_2026_11_27
      - name: Retain complete same-dataset reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcev-biov7-real-k562-matched-comparison
          path: results/biov7/
          if-no-files-found: warn
          retention-days: 75
