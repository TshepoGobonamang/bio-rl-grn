name: CI — tests and synthetic smoke
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run deterministic synthetic-only end-to-end smoke
        run: grnb smoke --output results/smoke --seed 42
      - name: Save engineering smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-NOT-biological-results
          path: results/smoke/
          if-no-files-found: warn
      - name: Run source-ablation GCEV controlled synthetic engineering pilot
        run: python scripts/controlled_synthetic_pilot.py --output results/gcev-pilot --seeds 11 42 77 --cells 130 --genes 7
      - name: Retain GCEV synthetic pilot outputs (not biological results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-gcev-engineering-pilot-NOT-biological
          path: results/gcev-pilot/
          if-no-files-found: warn
