name: M2D7 real GEO execution and decision report
on:
  workflow_dispatch:
  push:
    branches: [feat/m2d7-real-source-execution-gate]
    paths:
      - scripts/decide_m2d7_validation_gate.py
      - scripts/inspect_m2d6_geo_schema.py
      - tests/test_m2d7_validation_gate.py
      - .github/workflows/m2d7-real-source.yml
jobs:
  real-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pytest
      - name: Verify audit logic
        run: python -m pytest -q tests/test_m2d6_geo_schema.py tests/test_m2d6b_barcode_join.py tests/test_m2d7_validation_gate.py
      - name: Download true GSE216595 TF mapping into temporary runner storage
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --silent --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM6681nnn/GSM6681047/suppl/GSM6681047_180124_TFmap.csv.gz' \
            -o "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          file "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          gzip -t "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          sha256sum "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
      - name: Inspect observed GEO TF mapping
        run: |
          python scripts/inspect_m2d6_geo_schema.py \
            --tfmap "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz" \
            --output results/m2d7/observed_geo_schema.json
      - name: Produce explicit pending-assay readiness decision
        run: |
          python scripts/decide_m2d7_validation_gate.py \
            --schema results/m2d7/observed_geo_schema.json \
            --output results/m2d7/readiness_decision.json
      - name: Upload schema and readiness; never raw cell assignments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2d7-source-schema-readiness
          path: results/m2d7/*.json
          if-no-files-found: warn
