name: BIO-V3 original K562 single-cell training source inspection
on:
  push:
    branches: [research/gcev-biov3-k562-training-source-audit]
    paths:
      - 'scripts/audit_biov3_k562_scRNA_source.py'
      - 'tests/test_biov3_k562_source_audit.py'
      - 'configs/biov3_k562_training_candidate_2026_11_26.json'
      - '.github/workflows/gcev-biov3-k562-original-source.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source schema tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_biov3_k562_source_audit.py
      - name: Download original GEO expression and cell annotations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/biov3"
          curl --fail --location --retry 4 --retry-delay 5 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM5534nnn/GSM5534702/suppl/GSM5534702_K562-BT142_10x_scRNAseq_Expression.txt.gz' \
            -o "$RUNNER_TEMP/biov3/GSM5534702_K562-BT142_10x_scRNAseq_Expression.txt.gz"
          curl --fail --location --retry 4 --retry-delay 5 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM5534nnn/GSM5534702/suppl/GSM5534702_K562-BT142_10x_scRNAseq_MetaData.txt.gz' \
            -o "$RUNNER_TEMP/biov3/GSM5534702_K562-BT142_10x_scRNAseq_MetaData.txt.gz"
          gzip -t "$RUNNER_TEMP/biov3/"*.gz
          sha256sum "$RUNNER_TEMP/biov3/"*.gz
      - name: Audit original expression and cell-identity schema without ENCODE outcomes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_biov3_k562_scRNA_source.py \
            --expression "$RUNNER_TEMP/biov3/GSM5534702_K562-BT142_10x_scRNAseq_Expression.txt.gz" \
            --metadata "$RUNNER_TEMP/biov3/GSM5534702_K562-BT142_10x_scRNAseq_MetaData.txt.gz" \
            --output results/encode_biov3/k562_training_source_observation.json
      - name: Retain original-source schema report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcev-biov3-original-k562-training-source-schema
          path: results/encode_biov3/k562_training_source_observation.json
          if-no-files-found: warn
          retention-days: 60
