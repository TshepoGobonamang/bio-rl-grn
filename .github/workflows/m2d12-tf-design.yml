name: M2D12 TF assignment and experimental-design observations
on:
  workflow_dispatch:
jobs:
  descriptive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2d12-tf-design-audit
          persist-credentials: false
      - name: Verify files and study code revision
        run: |
          git rev-parse HEAD
          test -f scripts/audit_m2d12_tf_design.py
          test -f tests/test_m2d12_tf_design.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'anndata>=0.10,<0.13' pandas pytest
      - name: Test metadata aggregation
        run: python -m pytest -q tests/test_m2d12_tf_design.py
      - name: Download original GSE216595 H5AD
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 5 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE216nnn/GSE216595/suppl/GSE216595_180124_perturb.h5ad.gz' \
            -o "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          gzip -t "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          echo "Downloaded source sha256:"
          sha256sum "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
      - name: Generate real TF-by-batch-by-temp tables
        run: |
          python scripts/audit_m2d12_tf_design.py \
            --h5ad "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz" \
            --output results/m2d12/observed_tf_design.json
      - name: Publish descriptive audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2d12-observed-tf-design
          path: results/m2d12/observed_tf_design.json
          if-no-files-found: error
