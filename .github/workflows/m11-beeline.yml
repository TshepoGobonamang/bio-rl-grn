name: M1.1 BEELINE independent-test and directionality audit
on:
  workflow_dispatch:
    inputs:
      replicate_count:
        description: "Number of dyn-LL-500 replicates, 1 through 10"
        type: number
        default: 3
        required: true
      max_edges:
        description: "Fixed prospective graph-edit budget"
        type: number
        default: 20
        required: true
jobs:
  m11:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Download BEELINE v4 once; do not commit archive
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://zenodo.org/records/19009603/files/BEELINE-data.zip?download=1' \
            --output "$RUNNER_TEMP/BEELINE-data.zip"
      - name: Run exploratory replicate audit with untouched test
        env:
          REPLICATE_COUNT: ${{ inputs.replicate_count }}
          MAX_EDGES: ${{ inputs.max_edges }}
        run: |
          if [ "$REPLICATE_COUNT" -lt 1 ] || [ "$REPLICATE_COUNT" -gt 10 ]; then exit 2; fi
          for i in $(seq 1 "$REPLICATE_COUNT"); do
            id="dyn-LL-500-$i"
            echo "Executing $id"
            python scripts/extract_beeline_v4.py \
              --archive "$RUNNER_TEMP/BEELINE-data.zip" --run "$id" \
              --output "data/raw/beeline/$id"
            python scripts/run_m11.py \
              --raw-dir "data/raw/beeline/$id" \
              --processed-dir "data/processed/$id" \
              --results-dir "results/m11/$id" \
              --seed 42 --max-edges "$MAX_EDGES" \
              --alpha 1.0 --reverse-penalty 0.01
          done
          python scripts/aggregate_m11.py --root results/m11
      - name: Upload analysis tables and trajectories, not raw data
        uses: actions/upload-artifact@v4
        with:
          name: m11-beeline-direction-holdout
          path: results/m11/
          if-no-files-found: error
