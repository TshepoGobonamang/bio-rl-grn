name: BIO-V3 source identity launcher (main)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gcev-biov3-author-source-launcher.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-author-source-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/gcev-biov3-author-identity-reconciliation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source identity rejection and exact-barcode extraction
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_biov3_identity.py tests/test_biov3_probe.py
      - name: Record source-code SHA and original-publisher source index
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python scripts/biov3_probe_author_resources.py \
            --output results/biov3/author_resource_index_probe.json
      - name: Retrieve original GEO matrix and metadata (do not assign numeric identities)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/biov3"
          curl --fail --location --retry 3 --retry-delay 3 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM5534nnn/GSM5534702/suppl/GSM5534702_K562-BT142_10x_scRNAseq_Expression.txt.gz' \
            -o "$RUNNER_TEMP/biov3/original_expression.txt.gz"
          curl --fail --location --retry 3 --retry-delay 3 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM5534nnn/GSM5534702/suppl/GSM5534702_K562-BT142_10x_scRNAseq_MetaData.txt.gz' \
            -o "$RUNNER_TEMP/biov3/original_metadata.txt.gz"
          echo 'Frozen GEO source file checksums:'
          sha256sum "$RUNNER_TEMP/biov3/"*.gz
      - name: Only if discovered in publisher index, retrieve original author RDS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request
          p=pathlib.Path('results/biov3/author_resource_index_probe.json')
          data=json.loads(p.read_text())
          urls=data.get('verified_download_links',[])
          if len(urls)==1:
              url=urls[0]
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'GCEV-BIOV3-scientific-source-audit/0.1'})
                  dest=pathlib.Path('results/biov3/original_author_seurat.rds')
                  with urllib.request.urlopen(req,timeout=40) as response, dest.open('wb') as f:
                      size=0
                      while True:
                          part=response.read(1024*1024)
                          if not part:break
                          size+=len(part)
                          if size>700_000_000:raise ValueError('RDS larger than safety threshold')
                          f.write(part)
                  if size<10240:raise ValueError('Implausibly small RDS source')
                  print('Original author file retrieved; RDS parsing and ID validation still required')
              except Exception as err:
                  dest.unlink(missing_ok=True)
                  print('AUTHOR_RDS_UNAVAILABLE:',str(err)[:200])
          else:
              print('NO_GO_FOR_K562_EXPORT: author RDS has no verified public download link')
          PY
      - name: Extract original author cell labels and exact-match GEO source only when RDS exists
        shell: bash
        run: |
          set -euo pipefail
          rds='results/biov3/original_author_seurat.rds'
          if test -s "$rds"; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core r-cran-matrix
            Rscript scripts/biov3_extract_author_seurat_labels.R "$rds" results/biov3/original_author_cell_labels.csv
            sha256sum "$rds" | cut -d' ' -f1 > "$RUNNER_TEMP/biov3/author_rds_sha256.txt"
            python scripts/biov3_reconcile_k562_labels.py \
              --expression "$RUNNER_TEMP/biov3/original_expression.txt.gz" \
              --metadata "$RUNNER_TEMP/biov3/original_metadata.txt.gz" \
              --author-labels results/biov3/original_author_cell_labels.csv \
              --author-rds-sha256 "$(cat "$RUNNER_TEMP/biov3/author_rds_sha256.txt")" \
              --output results/biov3/verified_k562
          else
            echo 'NO_GO: cannot generate K562-only matrix without an author-labelled source RDS'
          fi
      - name: Prevent publishing an unverified author RDS itself
        if: always()
        shell: bash
        run: |
          rm -f results/biov3/original_author_seurat.rds
          rm -f results/biov3/original_author_cell_labels.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcev-biov3-original-author-identity-gate
          path: |
            results/biov3/author_resource_index_probe.json
            results/biov3/verified_k562/*.json
            results/biov3/verified_k562/*.gz
          if-no-files-found: error
