name: M2D15 real GEO TF-map reconciliation
on:
  workflow_dispatch:
    inputs:
      tfmap_cell_column:
        description: Exact observed TFmap cell-barcode column (blank means schema only)
        required: false
        type: string
      tfmap_tf_column:
        description: Exact observed TFmap construct/TF column (blank means schema only)
        required: false
        type: string
      tfmap_sample_column:
        description: Exact observed TFmap sample column (blank means cell-only diagnostic)
        required: false
        type: string
      h5ad_sample_column:
        description: Exact H5AD sample column (only if semantically equivalent)
        required: false
        type: string
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2d15-source-code-reconciliation
          persist-credentials: false
      - name: Verify implementation and revision
        run: |
          git rev-parse HEAD
          test -f scripts/reconcile_m2d15_tfmap_h5ad.py
          test -f tests/test_m2d15_tfmap_reconciliation.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis requirements
        run: python -m pip install 'anndata>=0.10,<0.13' pandas pytest
      - name: Run exact join unit tests
        run: python -m pytest -q tests/test_m2d15_tfmap_reconciliation.py
      - name: Download and validate original GEO files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 5 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM6681nnn/GSM6681047/suppl/GSM6681047_180124_TFmap.csv.gz' \
            -o "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          curl --fail --location --retry 4 --retry-delay 5 --show-error \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE216nnn/GSE216595/suppl/GSE216595_180124_perturb.h5ad.gz' \
            -o "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          gzip -t "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz"
          gzip -t "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz"
          sha256sum "$RUNNER_TEMP/"*.gz
      - name: Observe original TFmap schema and H5AD index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/m2d15
          python scripts/observe_m2d8_real_tfmap.py \
            --source "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz" \
            --output results/m2d15/observed_tfmap_schema.json
          python scripts/inspect_m2d10_h5ad.py \
            --h5ad "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz" \
            --output results/m2d15/observed_h5ad_schema.json
      - name: Reconcile only when exact keys supplied
        shell: bash
        env:
          CELL: ${{ inputs.tfmap_cell_column }}
          TF: ${{ inputs.tfmap_tf_column }}
          MS: ${{ inputs.tfmap_sample_column }}
          HS: ${{ inputs.h5ad_sample_column }}
        run: |
          set -euo pipefail
          if [[ -z "$CELL" || -z "$TF" ]]; then
            echo 'Schema-only run: provide validated TFmap column names in a subsequent manual dispatch.'
            exit 0
          fi
          args=(--h5ad "$RUNNER_TEMP/GSE216595_180124_perturb.h5ad.gz" \
                --tfmap "$RUNNER_TEMP/GSM6681047_180124_TFmap.csv.gz" \
                --tfmap-cell-column "$CELL" --tfmap-tf-column "$TF" \
                --output results/m2d15/reconciliation.json)
          if [[ -n "$MS" || -n "$HS" ]]; then
            if [[ -z "$MS" || -z "$HS" ]]; then
              echo 'Both sample columns must be supplied' >&2
              exit 2
            fi
            args+=(--tfmap-sample-column "$MS" --h5ad-sample-column "$HS")
          fi
          python scripts/reconcile_m2d15_tfmap_h5ad.py "${args[@]}"
      - name: Upload observed source data summaries even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2d15-real-source-reconciliation
          path: results/m2d15/*.json
          if-no-files-found: warn
